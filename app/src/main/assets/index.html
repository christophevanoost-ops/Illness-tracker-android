<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Illness Tracker</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6f7a8a;--line:#dfe5ee;--accent:#2f6fed;--danger:#c73a3a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}.wrap{max-width:950px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:#eaf0ff;color:#1e4faa}.danger{background:#fdeaea;color:var(--danger)}label{display:block;font-size:14px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{padding:11px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:700}.tab.active{background:var(--accent);color:#fff}.hidden{display:none!important}.small{font-size:13px;color:var(--muted)}.episode-row,.record-row{display:grid;grid-template-columns:1.1fr 2fr 1.2fr .7fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.record-row{grid-template-columns:1.1fr .9fr 2fr 1.1fr auto}.head{font-size:12px;font-weight:700;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal{background:#fff;border-radius:14px;padding:18px;max-width:480px;width:100%}@media(max-width:700px){.episode-row,.record-row,.row,.tabs{grid-template-columns:1fr}.head{display:none}}
</style>
</head>
<body><div class="wrap">
<h1>🤒 Illness Tracker</h1><div class="small" style="margin-bottom:15px">Track illness episodes, symptoms, temperature and medication.</div>

<section id="overview">
<div class="card"><div class="top"><h2>Illness episodes</h2><div class="actions"><button class="btn primary" id="newEpisode">+ New illness episode</button><button class="btn danger" id="deletePerson">Delete person</button></div></div>
<label>Filter by person</label><select id="personFilter"></select>
<div id="deletePersonPanel" class="hidden"><label>Person to delete</label><select id="personDeleteSelect"></select><div class="actions" style="margin-top:10px"><button class="btn danger" id="deletePersonConfirm">Delete selected person</button><button class="btn secondary" id="deletePersonCancel">Cancel</button></div></div>
<div id="episodeList"></div></div>
</section>

<section id="detail" class="hidden"><button class="btn secondary" id="back">← Back</button>
<div class="card" style="margin-top:10px">
<div id="createEpisodePanel" class="hidden"><h2>New illness episode</h2><div class="row"><div><label>Person</label><select id="createPerson"></select></div><div><label>Episode name</label><input id="episodeName" placeholder="e.g. Flu September 2026"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveEpisode">Create episode</button><button class="btn secondary" id="addPerson">+ Person</button></div><div id="addPersonPanel" class="hidden"><label>New person name</label><input id="newPersonName"><div class="actions" style="margin-top:8px"><button class="btn primary" id="savePerson">Save person</button><button class="btn secondary" id="cancelPerson">Cancel</button></div></div></div>

<div id="episodePanel" class="hidden"><div class="top"><div><div class="small">Currently recording for</div><strong id="currentEpisode"></strong></div><div class="actions"><button class="btn secondary" id="editEpisode">Edit episode</button><button class="btn danger" id="deleteEpisode">Delete episode</button></div></div>
<div id="editEpisodePanel" class="hidden"><label>Episode name</label><input id="editEpisodeName"><div class="actions" style="margin-top:8px"><button class="btn primary" id="saveEpisodeEdit">Save changes</button><button class="btn secondary" id="cancelEpisodeEdit">Cancel</button></div></div>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
<div class="tabs"><button class="tab active" data-type="temperature">🌡️ Temperature</button><button class="tab" data-type="symptoms">📝 Symptoms</button><button class="tab" data-type="medicine">💊 Medication</button></div>
<div id="temperatureFields"><label>Temperature (°C)</label><input id="temperature" type="number" step="0.1"></div>
<div id="symptomsFields" class="hidden"><label>Symptoms</label><textarea id="symptoms"></textarea><label>Severity</label><select id="severity"><option>Mild</option><option>Moderate</option><option>Severe</option></select></div>
<div id="medicineFields" class="hidden"><label>Medication name</label><input id="medicine"><label>Dose</label><input id="dose"></div>
<div class="row"><div><label>Date and time</label><input id="recordDate" type="datetime-local"></div><div><label>Reminder after</label><div class="row"><input id="reminderHours" type="number" min="0" value="0" placeholder="Hours"><input id="reminderMinutes" type="number" min="0" max="59" value="0" placeholder="Minutes"></div></div></div>
<label>Note</label><textarea id="note"></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveRecord">Save recording</button><button class="btn secondary" id="allowNotifications">Allow notifications</button></div>

<div class="card" style="margin-top:16px"><h3>History</h3><div class="small">Only recordings for this illness episode are shown.</div><div id="history"></div></div>
<div id="editRecordPanel" class="card hidden"><h3>Edit recording</h3><div id="editTemperatureFields" class="hidden"><label>Temperature</label><input id="editTemperature" type="number" step="0.1"></div><div id="editSymptomsFields" class="hidden"><label>Symptoms</label><textarea id="editSymptoms"></textarea><label>Severity</label><select id="editSeverity"><option>Mild</option><option>Moderate</option><option>Severe</option></select></div><div id="editMedicineFields" class="hidden"><label>Medication</label><input id="editMedicine"><label>Dose</label><input id="editDose"></div><div class="row"><div><label>Date and time</label><input id="editRecordDate" type="datetime-local"></div><div><label>Reminder after</label><div class="row"><input id="editReminderHours" type="number" min="0"><input id="editReminderMinutes" type="number" min="0" max="59"></div></div></div><label>Note</label><textarea id="editNote"></textarea><div class="actions" style="margin-top:8px"><button class="btn primary" id="saveRecordEdit">Save changes</button><button class="btn secondary" id="cancelRecordEdit">Cancel</button></div></div>
</div></div></section>
</div>

<div id="confirmModal" class="modalbg hidden"><div class="modal"><h3 id="confirmTitle">Confirm deletion</h3><p id="confirmText"></p><div class="actions"><button class="btn danger" id="confirmYes">Yes, delete</button><button class="btn secondary" id="confirmNo">Cancel</button></div></div></div>
<script>
const $=x=>document.getElementById(x),uid=p=>p+'-'+Date.now()+'-'+Math.random().toString(16).slice(2);let people=JSON.parse(localStorage.getItem('people')||'[]'),episodes=JSON.parse(localStorage.getItem('episodes')||'[]'),records=JSON.parse(localStorage.getItem('records')||'[]');if(!people.length)people=[{id:'p1',name:'Me'}];let activeEpisode=null,currentType='temperature',editingRecord=null,pending=null;
function save(){localStorage.setItem('people',JSON.stringify(people));localStorage.setItem('episodes',JSON.stringify(episodes));localStorage.setItem('records',JSON.stringify(records))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pad(n){return String(n).padStart(2,'0')}function ldt(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}function fmt(i){return new Intl.DateTimeFormat('en-GB',{dateStyle:'short',timeStyle:'short'}).format(new Date(i))}function confirmDelete(t,m,fn){pending=fn;$('confirmTitle').textContent=t;$('confirmText').textContent=m;$('confirmModal').classList.remove('hidden')}function closeConfirm(){pending=null;$('confirmModal').classList.add('hidden')}$('confirmYes').onclick=()=>{let f=pending;closeConfirm();if(f)f()};$('confirmNo').onclick=closeConfirm;
function fillPeople(){let o=people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('personFilter').innerHTML='<option value="all">All people</option>'+o;$('personDeleteSelect').innerHTML=o;$('createPerson').innerHTML=o}function renderOverview(){let f=$('personFilter').value||'all',list=[...episodes].filter(e=>f==='all'||e.personId===f).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));$('episodeList').innerHTML='<div class="episode-row head"><div>Person</div><div>Illness episode</div><div>Started</div><div>Records</div><div></div></div>'+list.map(e=>{let p=people.find(x=>x.id===e.personId),n=records.filter(r=>r.episodeId===e.id).length;return `<div class="episode-row"><div>${esc(p?.name||'Unknown')}</div><div><strong>${esc(e.name)}</strong></div><div>${fmt(e.startedAt)}</div><div>${n}</div><div class="actions"><button class="btn primary openEp" data-id="${e.id}">Open</button><button class="btn danger delEp" data-id="${e.id}">Delete</button></div></div>`}).join('');document.querySelectorAll('.openEp').forEach(b=>b.onclick=()=>openEpisode(b.dataset.id));document.querySelectorAll('.delEp').forEach(b=>b.onclick=()=>deleteEpisodeById(b.dataset.id))}
function showOverview(){activeEpisode=null;$('detail').classList.add('hidden');$('overview').classList.remove('hidden');fillPeople();renderOverview()}function showCreate(){activeEpisode=null;$('overview').classList.add('hidden');$('detail').classList.remove('hidden');$('createEpisodePanel').classList.remove('hidden');$('episodePanel').classList.add('hidden');$('episodeName').value=''}function openEpisode(id){let e=episodes.find(x=>x.id===id);if(!e)return;activeEpisode=id;$('overview').classList.add('hidden');$('detail').classList.remove('hidden');$('createEpisodePanel').classList.add('hidden');$('episodePanel').classList.remove('hidden');let p=people.find(x=>x.id===e.personId);$('currentEpisode').textContent=(p?.name||'Unknown')+' — '+e.name;$('recordDate').value=ldt();$('editRecordPanel').classList.add('hidden');renderHistory()}
function renderHistory(){let list=records.filter(r=>r.episodeId===activeEpisode).sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime));$('history').innerHTML=list.length?'<div class="record-row head"><div>Date & time</div><div>Type</div><div>Details</div><div>Reminder</div><div></div></div>'+list.map(r=>`<div class="record-row"><div>${fmt(r.dateTime)}</div><div>${esc(r.title)}</div><div>${esc(r.detail)}${r.note?`<div class="small">${esc(r.note)}</div>`:''}</div><div>${r.reminderAt?fmt(r.reminderAt):'—'}</div><div class="actions"><button class="btn secondary editRec" data-id="${r.id}">Edit</button><button class="btn danger delRec" data-id="${r.id}">Delete</button></div></div>`).join(''):'<div class="small" style="margin-top:10px">No recordings for this episode yet.</div>';document.querySelectorAll('.editRec').forEach(b=>b.onclick=()=>openRecordEdit(b.dataset.id));document.querySelectorAll('.delRec').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.id))}
function scheduleNative(r){if(window.Android&&Android.scheduleNotification&&r.reminderAt)Android.scheduleNotification(String(r.id),new Date(r.reminderAt).getTime(),'Illness Tracker',r.type==='medicine'?'Medication reminder: '+r.detail:'Reminder: '+r.detail)}function cancelNative(id){if(window.Android&&Android.cancelNotification)Android.cancelNotification(String(id))}
function deleteEpisodeById(id){let e=episodes.find(x=>x.id===id),n=records.filter(r=>r.episodeId===id).length;if(!e)return;confirmDelete('Delete illness episode',`Delete "${e.name}" and its ${n} recording(s)?`,()=>{records.filter(r=>r.episodeId===id).forEach(r=>cancelNative(r.id));episodes=episodes.filter(x=>x.id!==id);records=records.filter(r=>r.episodeId!==id);save();showOverview()})}function deleteRecord(id){let r=records.find(x=>x.id===id);if(!r)return;confirmDelete('Delete recording',`Delete this ${r.title.toLowerCase()} recording from ${fmt(r.dateTime)}?`,()=>{cancelNative(id);records=records.filter(x=>x.id!==id);save();renderHistory();renderOverview()})}
function saveNewEpisode(){let p=$('createPerson').value,n=$('episodeName').value.trim();if(!p||!n)return alert('Choose a person and enter an episode name.');let e={id:uid('e'),personId:p,name:n,startedAt:new Date().toISOString()};episodes.push(e);save();openEpisode(e.id)}function saveNewPerson(){let n=$('newPersonName').value.trim();if(!n)return;let p={id:uid('p'),name:n};people.push(p);save();fillPeople();$('createPerson').value=p.id;$('addPersonPanel').classList.add('hidden')}
function saveRecord(){let e=episodes.find(x=>x.id===activeEpisode);if(!e)return;let dt=$('recordDate').value;if(!dt)return;let title,detail;if(currentType==='temperature'){if(!$('temperature').value)return;title='Temperature';detail=$('temperature').value+' °C'}else if(currentType==='symptoms'){if(!$('symptoms').value.trim())return;title='Symptoms';detail=$('symptoms').value.trim()+' — '+$('severity').value}else{if(!$('medicine').value.trim())return;title='Medication';detail=$('medicine').value.trim()+($('dose').value.trim()?' — '+$('dose').value.trim():'')}let h=+$('reminderHours').value||0,m=+$('reminderMinutes').value||0,base=new Date(dt),delay=(h*60+m)*60000,r={id:uid('r'),personId:e.personId,episodeId:e.id,type:currentType,title,detail,note:$('note').value.trim(),dateTime:base.toISOString(),reminderHours:h,reminderMinutes:m,reminderAt:delay?new Date(base.getTime()+delay).toISOString():null};records.push(r);save();scheduleNative(r);$('temperature').value='';$('symptoms').value='';$('medicine').value='';$('dose').value='';$('note').value='';$('reminderHours').value=0;$('reminderMinutes').value=0;$('recordDate').value=ldt();renderHistory();renderOverview()}
function openRecordEdit(id){let r=records.find(x=>x.id===id);if(!r)return;editingRecord=id;['editTemperatureFields','editSymptomsFields','editMedicineFields'].forEach(x=>$(x).classList.add('hidden'));if(r.type==='temperature'){$('editTemperatureFields').classList.remove('hidden');$('editTemperature').value=r.detail.replace(' °C','')}else if(r.type==='symptoms'){$('editSymptomsFields').classList.remove('hidden');let p=r.detail.split(' — ');$('editSymptoms').value=p[0]||'';$('editSeverity').value=p[1]||'Mild'}else{$('editMedicineFields').classList.remove('hidden');let p=r.detail.split(' — ');$('editMedicine').value=p[0]||'';$('editDose').value=p[1]||''}$('editRecordDate').value=ldt(new Date(r.dateTime));$('editReminderHours').value=r.reminderHours||0;$('editReminderMinutes').value=r.reminderMinutes||0;$('editNote').value=r.note||'';$('editRecordPanel').classList.remove('hidden')}
function saveRecordEdit(){let r=records.find(x=>x.id===editingRecord);if(!r)return;cancelNative(r.id);if(r.type==='temperature')r.detail=$('editTemperature').value+' °C';else if(r.type==='symptoms')r.detail=$('editSymptoms').value.trim()+' — '+$('editSeverity').value;else r.detail=$('editMedicine').value.trim()+($('editDose').value.trim()?' — '+$('editDose').value.trim():'');r.dateTime=new Date($('editRecordDate').value).toISOString();r.note=$('editNote').value.trim();r.reminderHours=+$('editReminderHours').value||0;r.reminderMinutes=+$('editReminderMinutes').value||0;let d=(r.reminderHours*60+r.reminderMinutes)*60000;r.reminderAt=d?new Date(new Date(r.dateTime).getTime()+d).toISOString():null;save();scheduleNative(r);$('editRecordPanel').classList.add('hidden');editingRecord=null;renderHistory()}
$('newEpisode').onclick=showCreate;$('back').onclick=showOverview;$('saveEpisode').onclick=saveNewEpisode;$('addPerson').onclick=()=>$('addPersonPanel').classList.remove('hidden');$('savePerson').onclick=saveNewPerson;$('cancelPerson').onclick=()=>$('addPersonPanel').classList.add('hidden');$('personFilter').onchange=renderOverview;$('deletePerson').onclick=()=>{$('deletePersonPanel').classList.remove('hidden');fillPeople()};$('deletePersonCancel').onclick=()=>$('deletePersonPanel').classList.add('hidden');$('deletePersonConfirm').onclick=()=>{let id=$('personDeleteSelect').value,p=people.find(x=>x.id===id);if(!p)return;let ids=episodes.filter(e=>e.personId===id).map(e=>e.id);confirmDelete('Delete person',`Delete "${p.name}" and all related episodes and recordings?`,()=>{records.filter(r=>r.personId===id||ids.includes(r.episodeId)).forEach(r=>cancelNative(r.id));people=people.filter(x=>x.id!==id);episodes=episodes.filter(e=>e.personId!==id);records=records.filter(r=>r.personId!==id&&!ids.includes(r.episodeId));if(!people.length)people=[{id:uid('p'),name:'Me'}];save();$('deletePersonPanel').classList.add('hidden');showOverview()})};
$('editEpisode').onclick=()=>{let e=episodes.find(x=>x.id===activeEpisode);$('editEpisodeName').value=e?.name||'';$('editEpisodePanel').classList.remove('hidden')};$('cancelEpisodeEdit').onclick=()=>$('editEpisodePanel').classList.add('hidden');$('saveEpisodeEdit').onclick=()=>{let e=episodes.find(x=>x.id===activeEpisode),n=$('editEpisodeName').value.trim();if(e&&n){e.name=n;save();$('editEpisodePanel').classList.add('hidden');openEpisode(e.id);renderOverview()}};$('deleteEpisode').onclick=()=>deleteEpisodeById(activeEpisode);$('saveRecord').onclick=saveRecord;$('saveRecordEdit').onclick=saveRecordEdit;$('cancelRecordEdit').onclick=()=>{$('editRecordPanel').classList.add('hidden');editingRecord=null};$('allowNotifications').onclick=()=>{if(window.Android&&Android.requestNotificationPermission)Android.requestNotificationPermission();else alert('Notifications are available in the Android app.')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentType=b.dataset.type;$('temperatureFields').classList.toggle('hidden',currentType!=='temperature');$('symptomsFields').classList.toggle('hidden',currentType!=='symptoms');$('medicineFields').classList.toggle('hidden',currentType!=='medicine')});fillPeople();$('recordDate').value=ldt();save();renderOverview();
</script></body></html>
