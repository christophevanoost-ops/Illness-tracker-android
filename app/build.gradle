plugins { id 'com.android.application' }

android {
    namespace 'com.example.illnesstracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.illnesstracker'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
