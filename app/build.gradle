plugins { id 'com.android.application' }

android {
    namespace 'com.example.illnesstracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.illnesstracker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
